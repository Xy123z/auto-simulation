<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vision's Auto Simulation</title>
<link rel="icon" type="image/png" href="./assets/logo/Vision.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<!-- Shown only if this file is opened directly (file://) instead of via
     `npm start` + http://localhost:8787 — every fetch() in this app uses an
     absolute path, which only resolves against a real server. -->
<div class="proto-banner" id="protoBanner">
  <div>
    <strong>This page needs to be served, not opened directly.</strong>
    <div>Run <code>npm start</code> in the project folder, then open <code>http://localhost:8787</code> in your browser.</div>
  </div>
</div>

<!-- <div class="header">
  <div class="brand">
    <div class="brand-icon"><img src="./assets/logo/Vision.png" alt="Vision" /></div>
    <div>
      <div class="brand-name">Vision</div>
      <div class="brand-sub">Auto-Simulation — voice-driven robot</div>
    </div>
  </div>
  <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Loading model…</span></div>
  <div class="spacer"></div>
  <div class="badge" id="llmBadge">LLM: checking…</div>
</div> -->

<div class="main">
  <div class="stage-panel">
    <div id="stage3d"></div>
    <div class="model-loading" id="modelLoading">Loading 3D model…</div>
    <div class="body-state" id="bodyState">Idle</div>

    <!-- transient caption — shows what you said and what Vision replied,
         then fades; this is the whole "conversation", by design there's no
         persistent chat log, just the mic. -->
    <div class="caption" id="caption"></div>

    <div class="support-warning" id="supportWarning">
      Your browser doesn't support continuous speech recognition — try Chrome or Edge.
      <button class="fallback-toggle" id="fallbackToggle">Type instead</button>
    </div>

    <div class="mic-dock">
      <button class="mic-btn" id="micBtn" title="Toggle microphone">
        <i class="fa-solid fa-microphone-slash" id="micIcon"></i>
      </button>
      <div class="mic-hint">Tap to talk · say "Vision, dance"</div>
    </div>

    <!-- Hidden unless speech recognition is unsupported, or the keyboard
         icon is tapped — a small escape hatch, not a chat panel. -->
    <form class="fallback-input" id="fallbackForm">
      <input id="fallbackText" type="text" placeholder="Type to Vision…" autocomplete="off" />
      <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <button class="keyboard-toggle" id="keyboardToggle" title="Type instead"><i class="fa-solid fa-keyboard"></i></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="./js/client.js"></script>
</body>
</html>
